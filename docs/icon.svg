      <path d="M 236 286 L 788 286 L 764 700 L 512 800 L 260 700 Z" fill="none" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="40" stroke-linejoin="round"/>
      <path d="M 250 380 L 774 380" stroke="#FFFFFF" stroke-opacity="0.9" stroke-width="28" stroke-linecap="round"/>
    </g>
    <g fill="none" stroke="#FFFFFF" stroke-opacity="0.6" stroke-width="14" stroke-dasharray="28 22" stroke-linecap="round" stroke-linejoin="round">
      <path d="M 300 333 L 724 333"/>
      <path d="M 302 432 L 318 668 L 512 744 L 706 668 L 722 432"/>
    </g>
    <!-- Transformer: tokens + attention -->
    <g filter="url(#shadow)">
      <g stroke="#FFFFFF" stroke-linecap="round">
        <path d="M 404 628 L 404 476" stroke-width="22"/>
        <path d="M 512 628 L 512 476" stroke-width="22"/>
        <path d="M 620 628 L 620 476" stroke-width="22"/>
        <path d="M 404 628 L 512 476" stroke-width="13" stroke-opacity="0.55"/>
        <path d="M 512 628 L 404 476" stroke-width="13" stroke-opacity="0.55"/>
        <path d="M 512 628 L 620 476" stroke-width="17" stroke-opacity="0.8"/>
        <path d="M 620 628 L 512 476" stroke-width="17" stroke-opacity="0.8"/>
        <path d="M 404 628 L 620 476" stroke-width="10" stroke-opacity="0.4"/>
        <path d="M 620 628 L 404 476" stroke-width="10" stroke-opacity="0.4"/>
      </g>
      <g fill="#FFFFFF">
        <circle cx="404" cy="476" r="38"/><rect x="368" y="594" width="72" height="66" rx="18"/>
        <circle cx="512" cy="476" r="38"/><rect x="476" y="594" width="72" height="66" rx="18"/>
        <circle cx="620" cy="476" r="38"/><rect x="584" y="594" width="72" height="66" rx="18"/>
      </g>
