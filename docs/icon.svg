<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Flat preview of Pockli/Pockli.icon for the README (Icon Composer adds the glass effects). -->
  <defs>
    <linearGradient id="bg" x1="0.15" y1="0" x2="0.85" y2="1">
      <stop offset="0" stop-color="#3FC8F5"/>
      <stop offset="1" stop-color="#7A55F0"/>
    </linearGradient>
    <clipPath id="squircle"><rect width="1024" height="1024" rx="230"/></clipPath>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
